; Free Menu Cursor - lets the Windows cursor leave the game window while a menu cursor is shown.
; Re-read every time a cursor menu opens, so you can edit it with the game running.
; All of these can also be changed in-game from SKSE Menu Framework (Free Menu Cursor/Settings).
[General]
bEnabled=1
; Which menus free the cursor
bVanillaMenus=1
bSKSEMenuFramework=1
bFLICK=1
; Keep the in-game cursor on the Windows cursor in vanilla menus
; 0=off 1=direct (default) 2=compensate 3=post-write
iVanillaSyncMode=1
; Keep FLICK's cursor on the Windows cursor (stops it drifting when you leave and re-enter
; the window). Set to 0 if FLICK's cursor shakes.
bFLICKSync=1
; Switch the game's mouse to non-exclusive while a menu is open, so clicks reach other
; windows and the cursor can be hidden over the game. Required for clicking outside.
bNonExclusiveMouseInMenus=1
; Move the Windows cursor to the in-game cursor when a menu opens
bAlignOnOpen=1
; Lock the cursor to the game window again when the menu closes
bReclipOnClose=1
; Hide the Windows cursor over the game window (the game draws its own)
bHideOSCursorInsideWindow=1
; OPTIONAL - Windows pointer settings while a menu cursor is free. Off by default.
; While free, the menu cursor follows the Windows cursor, so its speed is the Windows pointer
; speed. These change the system pointer temporarily (never saved to your Windows settings)
; and restore it when the menu closes, the game loses focus, or the game exits. If the game
; crashes, "Free Menu Cursor Restore.exe" puts it back; the next launch also checks.
; Speed multiplier: 1.0 = leave Windows alone (default), e.g. 1.5, 2.0, 0.5
fMenuCursorSpeed=1.0
; Enhance pointer precision (acceleration) in menus: -1 = leave Windows alone (default), 0 = off, 1 = on
iMenuPointerPrecision=-1
; Hold this key to free the cursor without opening a menu (camera and mouse buttons are
; ignored while it is free). Move the cursor out of the window while holding it and it stays
; free after you let go, until you click the game window. Tap it inside the window to cancel.
; DirectInput scan code, decimal or 0x hex. 0x9D=Right Ctrl, 0xB8=Right Alt, 0x3A=CapsLock, 0=off
iFreeCursorKey=0x9D
; Do not pass that key to the game or other mods
bBlockFreeCursorKey=1
; Settings page language: auto (follow the game's sLanguage), en, ja
sLanguage=auto
; Verbose log in Documents\My Games\Skyrim Special Edition\SKSE\Free Menu Cursor.log
; (a short startup log is always written)
bDebugLog=0
